name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: pre-commit/action@v3.0.1
        env:
          SKIP: tsc # the `build` job typechecks with the real node_modules

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # ponytail: one guarded block until Phase 0 lands package.json; then split
      # into named steps, drop the guard, and add `cache: npm` above (it needs a
      # lockfile to exist).
      - run: |
          [ -f package.json ] || { echo "no package.json yet (pre Phase 0) - nothing to build"; exit 0; }
          npm ci
          npm run lint
          npm test
          npm run build
          npx playwright install --with-deps chromium
          npm run test:browser
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
